# Runs the full test suite on every push and pull request.
#
# The suite needs no API key: the language model is replaced by a scripted
# stand-in. Python 3.10 is the oldest version the README supports; 3.14 is the
# version the project is developed on.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
